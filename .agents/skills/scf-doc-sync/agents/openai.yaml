name: scf-doc-sync
version: 1.1.0
display_name: Living Docs & Status Synchronizer
description: Synchronizes STATUS.md, README.md, LATEST_SESSION.md, and ADRs in plain language from verified gates and Git state.
default_model_slot: light_ops_slot
model_registry: .factory/models.json
invocation:
  slash_command: /scf-doc-sync
  writes_only:
    - STATUS.md
    - README.md
    - AGENTS.md
    - docs/handoff/
