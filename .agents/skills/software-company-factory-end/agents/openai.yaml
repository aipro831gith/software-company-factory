name: software-company-factory-end
version: 1.1.0
display_name: Factory Session End
description: Runs atomic Git checkpoint, updates STATUS.md and handoff docs, and sets session lock to ENDED for clean department isolation.
default_model_slot: light_ops_slot
model_registry: .factory/models.json
invocation:
  slash_command: /software-company-factory-end
  aliases:
    - /scf-end
isolation:
  lock_file: .factory/session.lock.json
  target_status: ENDED
